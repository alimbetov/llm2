service:
  environment: development
  instance_id: fix487b-mixed-load-runtime
grpc:
  host: 127.0.0.1
  port: ${FIX487B_GRPC_PORT:-50589}
shutdown:
  drain_timeout_seconds: 1
security:
  enabled: false
  protect_health: false
postgres:
  url: ${ASTRAVECTOR_DB_URL:-postgres://astravector:astravector@127.0.0.1:60432/astravector}
  auto_migrate: false
  required_on_startup: true
  required_for_readiness: true
qdrant:
  enabled: true
  url: ${ASTRAVECTOR_QDRANT_URL:-http://127.0.0.1:6833}
  collection: ${ASTRAVECTOR_QDRANT_COLLECTION:-astravector_fix487b}
  auto_create_collection: true
  validate_collection_schema: true
  ensure_payload_indexes: true
  publisher:
    enabled: true
    batch_size: 64
    poll_interval_ms: 100
    max_attempts: 10
metrics:
  host: 127.0.0.1
  port: ${FIX487B_METRICS_PORT:-9059}
recovery:
  enabled: false
lifecycle:
  enabled: false
index_ttl:
  cleanup_enabled: false
  qdrant_reconciliation_enabled: false
access_zone_registry:
  auto_create_on_ingestion: true
  auto_create_on_search: false
