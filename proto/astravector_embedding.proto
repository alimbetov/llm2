syntax = "proto3";
package astravector.embedding.v1;

service AstraVectorRuntime {
  rpc Encode(EncodeRequest) returns (EncodeResponse);
  rpc EncodeBatch(EncodeBatchRequest) returns (EncodeBatchResponse);
  rpc GetContract(GetContractRequest) returns (GetContractResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc DeleteDocumentVectors(DeleteDocumentVectorsRequest) returns (DeleteDocumentVectorsResponse);
  rpc UpdateVectorMetadata(UpdateVectorMetadataRequest) returns (UpdateVectorMetadataResponse);
  rpc ExtendVectorTtl(ExtendVectorTtlRequest) returns (ExtendVectorTtlResponse);
  rpc GetVectorSyncStatus(GetVectorSyncStatusRequest) returns (GetVectorSyncStatusResponse);
  rpc EvaluateRelevance(EvaluateRelevanceRequest) returns (EvaluateRelevanceResponse);
  rpc PreviewEmbedding(PreviewEmbeddingRequest) returns (PreviewEmbeddingResponse);
}

enum EncodingPurpose {
  ENCODING_PURPOSE_UNSPECIFIED = 0;
  QUERY = 1;
  DOCUMENT_CHUNK = 2;
}

enum ChunkType {
  CHUNK_TYPE_UNSPECIFIED = 0;
  PARENT = 1;
  CHILD = 2;
}

enum RepresentationType {
  REPRESENTATION_TYPE_UNSPECIFIED = 0;
  DENSE = 1;
  BGE_LEARNED_SPARSE = 2;
}

enum AccessLevel {
  ACCESS_LEVEL_UNSPECIFIED = 0;
  PUBLIC = 1;
  INTERNAL = 2;
  CONFIDENTIAL = 3;
  RESTRICTED = 4;
}

enum SearchRepresentationType {
  SEARCH_REPRESENTATION_UNSPECIFIED = 0;
  ORIGINAL = 1;
  SUMMARY = 2;
  SYNTHETIC_QUESTION = 3;
  KEY_FACT = 4;
  ENTITY = 5;
  TERM = 6;
  DEFINITION = 7;
  FAQ = 8;
}

enum PersistenceMode {
  PERSISTENCE_MODE_UNSPECIFIED = 0;
  NONE = 1;
  BEST_EFFORT = 2;
  REQUIRED = 3;
}


enum EmbeddingModeV005 {
  EMBEDDING_MODE_V005_UNSPECIFIED = 0;
  EMBEDDING_MODE_V005_DENSE_ONLY = 1;
  EMBEDDING_MODE_V005_DENSE_SPARSE_IF_AVAILABLE = 2;
  EMBEDDING_MODE_V005_DENSE_SPARSE_REQUIRED = 3;
}

enum SearchModeV005 {
  SEARCH_MODE_V005_UNSPECIFIED = 0;
  SEARCH_MODE_V005_DENSE = 1;
  SEARCH_MODE_V005_SPARSE = 2;
  SEARCH_MODE_V005_HYBRID = 3;
}

enum PublishModeV005 {
  PUBLISH_MODE_V005_UNSPECIFIED = 0;
  PUBLISH_MODE_V005_OUTBOX = 1;
  PUBLISH_MODE_V005_NONE = 2;
}

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_COMPLETED = 1;
  ITEM_FAILED = 2;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_COMPLETED = 1;
  TASK_PARTIALLY_COMPLETED = 2;
  TASK_FAILED = 3;
}

message EncodeItem {
  string chunk_id = 1;
  ChunkType chunk_type = 2;
  string text = 3;
  optional string parent_chunk_id = 4;
  optional string content_hash = 5;
  optional string document_id = 6;
  optional uint64 document_version = 7;
  AccessLevel access_level = 8;
  optional uint32 ttl_days = 9;
  SearchRepresentationType representation_type = 10;
  optional string source_chunk_id = 11;
  map<string, string> metadata = 12;
}

message EncodeRequest {
  string emb_task_id = 1;
  string correlation_id = 2;
  string idempotency_key = 3;
  string tenant_id = 4;
  string workspace_id = 5;
  string caller_service = 6;
  AccessLevel access_level = 7;
  EncodingPurpose purpose = 8;
  repeated RepresentationType requested_representations = 9;
  EncodeItem item = 10;
  string expected_contract_version = 11;
  string expected_tokenizer_version = 12;
  string expected_embedding_version = 13;
  PersistenceMode persistence_mode = 14;
}

message EncodeBatchRequest {
  string emb_task_id = 1;
  string correlation_id = 2;
  string idempotency_key = 3;
  string tenant_id = 4;
  string workspace_id = 5;
  string caller_service = 6;
  AccessLevel access_level = 7;
  EncodingPurpose purpose = 8;
  repeated RepresentationType requested_representations = 9;
  repeated EncodeItem items = 10;
  string expected_contract_version = 11;
  string expected_tokenizer_version = 12;
  string expected_embedding_version = 13;
  PersistenceMode persistence_mode = 14;
}

message DenseRepresentation {
  string name = 1;
  repeated float values = 2;
  uint32 dimension = 3;
  bool normalized = 4;
  string distance = 5;
  string version = 6;
}

message SparseRepresentation {
  string name = 1;
  repeated uint32 indices = 2;
  repeated float values = 3;
  string version = 4;
}

message EncodeItemResponse {
  string chunk_id = 1;
  ChunkType chunk_type = 2;
  optional string parent_chunk_id = 3;
  ItemStatus status = 4;
  optional DenseRepresentation dense = 5;
  optional SparseRepresentation learned_sparse = 6;
  uint32 model_input_token_count = 7;
  bool truncated = 8;
  bool l1_cache_hit = 9;
  bool l2_cache_hit = 10;
  optional string error_code = 11;
  optional string error_message = 12;
}

message ContractVersions {
  string contract_version = 1;
  string model_version = 2;
  string tokenizer_version = 3;
  string dense_version = 4;
  string sparse_version = 5;
  string pooling_version = 6;
  string normalization_version = 7;
}

message RuntimeMetadata {
  string execution_provider = 1;
  string onnxruntime_version = 2;
  string device_name = 3;
  bool fallback_used = 4;
}

message PersistenceResult {
  string mode = 1;
  string status = 2;
  optional string error_code = 3;
  optional string error_message = 4;
}

message EncodeResponse {
  string emb_task_id = 1;
  string correlation_id = 2;
  EncodeItemResponse item = 3;
  PersistenceResult persistence = 4;
  ContractVersions versions = 5;
  RuntimeMetadata runtime = 6;
}

message EncodeBatchResponse {
  string emb_task_id = 1;
  string correlation_id = 2;
  TaskStatus status = 3;
  repeated EncodeItemResponse items = 4;
  PersistenceResult persistence = 5;
  ContractVersions versions = 6;
  RuntimeMetadata runtime = 7;
}


message PreviewEmbeddingRequest {
  string correlation_id = 1;
  string text = 2;
  EncodingPurpose purpose = 3;
  EmbeddingModeV005 embedding_mode = 4;
  bool include_dense = 10;
  bool include_sparse = 11;
  bool include_full_dense = 12;
  uint32 top_sparse = 13;
  uint64 timeout_ms = 20;
}

message DensePreviewV005 {
  uint32 dimension = 1;
  float norm = 2;
  repeated float preview_values = 3;
  repeated float full_values = 4;
}

message SparsePreviewV005 {
  uint32 non_zero_count = 1;
  repeated uint32 indices = 2;
  repeated float values = 3;
}

message TokenizationPreviewV005 {
  uint32 token_count = 1;
  uint32 max_tokens = 2;
  bool truncated = 3;
}

message DiagnosticWarningV005 {
  string code = 1;
  string message = 2;
}

message PreviewEmbeddingResponse {
  string model_version = 1;
  string tokenizer_version = 2;
  string dense_version = 3;
  string sparse_version = 4;
  DensePreviewV005 dense = 10;
  SparsePreviewV005 sparse = 11;
  TokenizationPreviewV005 tokenization = 12;
  repeated DiagnosticWarningV005 warnings = 20;
}

message GetContractRequest {}
message GetContractResponse {
  ContractVersions versions = 1;
  string model_id = 2;
  uint32 dense_dimension = 3;
  string dense_distance = 4;
}

message GetCapabilitiesRequest {}
message GetCapabilitiesResponse {
  repeated EncodingPurpose purposes = 1;
  repeated ChunkType chunk_types = 2;
  repeated RepresentationType representations = 3;
  uint32 dense_dimension = 4;
  uint32 max_query_tokens = 5;
  uint32 max_child_tokens = 6;
  bool parent_embedding_enabled = 7;
  RuntimeMetadata runtime = 8;
}

message HealthRequest {}
message HealthResponse {
  string status = 1;
  bool ready = 2;
  string details = 3;
}

message DeleteDocumentVectorsRequest { string tenant_id = 1; string workspace_id = 2; string document_id = 3; optional uint64 document_version = 4; string correlation_id = 5; }
message DeleteDocumentVectorsResponse { uint64 affected_bindings = 1; string status = 2; }
message UpdateVectorMetadataRequest { string tenant_id = 1; string workspace_id = 2; string binding_id = 3; AccessLevel access_level = 4; optional uint32 ttl_days = 5; map<string,string> metadata = 6; }
message UpdateVectorMetadataResponse { string binding_id = 1; string status = 2; }
message ExtendVectorTtlRequest { string tenant_id = 1; string workspace_id = 2; string binding_id = 3; uint32 ttl_days = 4; bool replace = 5; }
message ExtendVectorTtlResponse { string binding_id = 1; string expires_at = 2; string status = 3; }
message GetVectorSyncStatusRequest { string access_zone_id = 1; string document_id = 2; uint64 document_version = 3; bool include_qdrant = 10; }
message GetVectorSyncStatusResponse {
  string document_status = 1;
  uint32 expected_bindings = 10;
  uint32 synced_bindings = 11;
  uint32 pending_bindings = 12;
  uint32 failed_bindings = 13;
  uint32 dense_vectors_expected = 20;
  uint32 dense_vectors_found = 21;
  uint32 sparse_vectors_expected = 22;
  uint32 sparse_vectors_found = 23;
  uint32 outbox_pending = 30;
  uint32 outbox_retry_pending = 31;
  uint32 outbox_completed = 32;
  uint32 outbox_failed = 33;
  string qdrant_collection = 40;
  bool qdrant_collection_exists = 41;
  uint32 qdrant_points_expected = 42;
  uint32 qdrant_points_found = 43;
  uint32 qdrant_points_missing = 44;
  uint32 qdrant_points_extra = 45;
  bool ready_to_activate = 50;
  string last_sync_attempt_at = 60;
  string last_sync_error_code = 61;
  string last_sync_error_message = 62;
  repeated DiagnosticWarningV005 warnings = 70;
}
message EvaluateRelevanceRequest { string tenant_id = 1; string workspace_id = 2; string question = 3; string candidate_text = 4; optional string answer = 5; repeated string source_texts = 6; }
message EvaluateRelevanceResponse { float dense_score = 1; float lexical_score = 2; float consistency_score = 3; float final_score = 4; string decision = 5; string evaluation_id = 6; }


// v004 control plane. The v1 runtime service remains wire-compatible during migration.
service AstraVectorV004Control {
  rpc Search(SearchRequestV004) returns (SearchResponseV004);
  rpc CreateMultiGranularityChunks(CreateMultiGranularityChunksRequest) returns (CreateMultiGranularityChunksResponse);
  rpc GetChunkGroup(GetChunkGroupRequest) returns (GetChunkGroupResponse);
  rpc ResolveParentContext(ResolveParentContextRequest) returns (ResolveParentContextResponse);
  rpc RegisterDocumentVersion(RegisterDocumentVersionRequest) returns (DocumentVersionResponse);
  rpc ActivateDocumentVersion(ActivateDocumentVersionRequest) returns (DocumentVersionResponse);
  rpc ExplainSearch(ExplainSearchRequest) returns (ExplainSearchResponse);
  rpc DebugDocumentState(DebugDocumentStateRequest) returns (DebugDocumentStateResponse);
  rpc RetryVectorOutbox(RetryVectorOutboxRequest) returns (RetryVectorOutboxResponse);
}


// v007 public facade contracts. These APIs simplify integration for llm_indexator and ai_bro
// while keeping v004/v005 reliability mechanisms internal: outbox, sync, activation,
// Qdrant reconciliation, TTL, diagnostics, and safe adaptive runtime.
service AstraVectorIngestionFacade {
  rpc IndexLogicalDocument(IndexLogicalDocumentRequest) returns (IndexLogicalDocumentResponse);
  rpc StartLogicalDocumentIngestion(StartLogicalDocumentIngestionRequest) returns (StartLogicalDocumentIngestionResponse);
  rpc AppendLogicalDocumentBlocks(AppendLogicalDocumentBlocksRequest) returns (AppendLogicalDocumentBlocksResponse);
  rpc FinalizeLogicalDocumentIngestion(FinalizeLogicalDocumentIngestionRequest) returns (IndexLogicalDocumentResponse);
  rpc AbortLogicalDocumentIngestion(AbortLogicalDocumentIngestionRequest) returns (AbortLogicalDocumentIngestionResponse);
  rpc GetLogicalDocumentIngestionStatus(GetLogicalDocumentIngestionStatusRequest) returns (GetLogicalDocumentIngestionStatusResponse);
  rpc GetDocumentVectorStatus(GetDocumentVectorStatusRequest) returns (GetDocumentVectorStatusResponse);
  rpc DeleteDocumentVectorsFacade(DeleteDocumentVectorsFacadeRequest) returns (DeleteDocumentVectorsFacadeResponse);
}

service AstraVectorRetrievalFacade {
  rpc RetrieveContext(RetrieveContextRequest) returns (RetrieveContextResponse);
  rpc ExplainRetrieve(ExplainRetrieveRequest) returns (ExplainRetrieveResponse);
}

service AstraVectorAdminFacade {
  rpc DebugDocument(DebugDocumentRequest) returns (DebugDocumentResponse);
  rpc RetryOutbox(RetryOutboxFacadeRequest) returns (RetryOutboxFacadeResponse);
  rpc RetryDocumentDeletion(RetryDocumentDeletionRequest) returns (RetryDocumentDeletionResponse);
  rpc GetRuntimeHealth(GetRuntimeHealthRequest) returns (GetRuntimeHealthResponse);
}

message RequestContext {
  string correlation_id = 1;
  string idempotency_key = 2;
  string caller_service = 3;
  string caller_user_id = 4;
  AccessLevel caller_access_level = 5;
}

message DocumentRef {
  string access_zone_id = 1;
  string document_id = 2;
  uint64 document_version = 3;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_ACCEPTED = 1;
  OPERATION_STATE_INDEXING = 2;
  OPERATION_STATE_VECTORING = 3;
  OPERATION_STATE_PUBLISHING = 4;
  OPERATION_STATE_SYNCING = 5;
  OPERATION_STATE_READY_TO_ACTIVATE = 6;
  OPERATION_STATE_ACTIVE = 7;
  OPERATION_STATE_FAILED = 8;
  OPERATION_STATE_EXPIRED = 9;
  OPERATION_STATE_DELETED = 10;
  // v007 fix1: asynchronous deletion states. DELETE_POINT is scheduled via outbox
  // and must not be reported as DELETED until publisher/reconciliation confirms it.
  OPERATION_STATE_DELETE_SCHEDULED = 11;
  OPERATION_STATE_DELETING = 12;
}

message OperationError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string remediation = 4;
}

message OperationStatus {
  string operation_id = 1;
  OperationState state = 2;
  string message = 3;
  repeated DiagnosticWarningV005 warnings = 10;
  repeated OperationError errors = 11;
}

message DocumentIdentity {
  string external_document_id = 1;
  string document_id = 2;
  uint64 document_version = 3;
  string title = 4;
  string source_uri = 5;
  string source_type = 6;
  string mime_type = 7;
  string content_hash = 10;
  repeated SourceLink source_links = 20;
}

enum BlockType {
  BLOCK_TYPE_UNSPECIFIED = 0;
  BLOCK_TYPE_DOCUMENT = 1;
  BLOCK_TYPE_SECTION = 2;
  BLOCK_TYPE_SUBSECTION = 3;
  BLOCK_TYPE_PARAGRAPH = 4;
  BLOCK_TYPE_TABLE = 5;
  BLOCK_TYPE_TABLE_ROW = 6;
  BLOCK_TYPE_LIST = 7;
  BLOCK_TYPE_LIST_ITEM = 8;
  BLOCK_TYPE_FAQ_ITEM = 9;
  BLOCK_TYPE_CODE_BLOCK = 10;
  BLOCK_TYPE_CAPTION = 11;
}

message LogicalBlock {
  string block_id = 1;
  string parent_block_id = 2;
  BlockType block_type = 3;
  string text = 10;
  uint32 order_index = 20;
  SourceLocation source_location = 30;
  repeated SourceLink source_links = 31;
  map<string, string> metadata = 40;
}

message SourceLocation {
  uint32 page_start = 1;
  uint32 page_end = 2;
  uint32 char_start = 3;
  uint32 char_end = 4;
  string section_path = 10;
  string heading = 11;
  string table_id = 20;
  uint32 row_index = 21;
  uint32 column_index = 22;
}

enum SourceLinkType {
  SOURCE_LINK_TYPE_UNSPECIFIED = 0;
  SOURCE_LINK_TYPE_ORIGINAL_DOCUMENT = 1;
  SOURCE_LINK_TYPE_PREVIEW = 2;
  SOURCE_LINK_TYPE_DOWNLOAD = 3;
  SOURCE_LINK_TYPE_PAGE = 4;
  SOURCE_LINK_TYPE_SECTION = 5;
  SOURCE_LINK_TYPE_CHUNK = 6;
  SOURCE_LINK_TYPE_EXTERNAL_SYSTEM = 7;
}

message SourceLink {
  SourceLinkType type = 1;
  string url = 2;
  string label = 3;
  string mime_type = 4;
  bool requires_auth = 5;
  string expires_at = 6;
  map<string, string> attributes = 20;
}

enum ChunkingProfile {
  CHUNKING_PROFILE_UNSPECIFIED = 0;
  CHUNKING_PROFILE_DEFAULT = 1;
  CHUNKING_PROFILE_LEGAL = 2;
  CHUNKING_PROFILE_TECHNICAL = 3;
  CHUNKING_PROFILE_FAQ = 4;
  CHUNKING_PROFILE_TABLE_HEAVY = 5;
}

message TokenAwareChunkingOptions {
  ChunkingProfile profile = 1;
  uint32 parent_target_tokens = 10;
  uint32 parent_max_tokens = 11;
  uint32 child_target_tokens = 20;
  uint32 child_max_tokens = 21;
  uint32 child_overlap_tokens = 22;
  uint32 min_chunk_tokens = 30;
  bool preserve_block_boundaries = 40;
  bool allow_split_inside_paragraph = 41;
  bool allow_split_inside_table = 42;
  bool create_parent_context = 50;
}

enum ActivationPolicy {
  ACTIVATION_POLICY_UNSPECIFIED = 0;
  ACTIVATION_POLICY_MANUAL = 1;
  ACTIVATION_POLICY_AUTO_WHEN_READY = 2;
  ACTIVATION_POLICY_SKIP = 3;
}

enum TtlMode {
  TTL_MODE_UNSPECIFIED = 0;
  TTL_MODE_NONE = 1;
  TTL_MODE_RELATIVE = 2;
  TTL_MODE_ABSOLUTE = 3;
}

message TtlPolicy {
  TtlMode mode = 1;
  uint64 ttl_seconds = 2;
  string expires_at = 3;
  bool delete_from_qdrant_on_expire = 10;
  bool keep_metadata_after_expire = 11;
}

message VectorIndexingOptions {
  ActivationPolicy activation_policy = 1;
  EmbeddingModeV005 embedding_mode = 2;
  PublishModeV005 publish_mode = 3;
  TtlPolicy ttl_policy = 10;
  bool replace_existing_version = 20;
}

message IndexLogicalDocumentRequest {
  RequestContext context = 1;
  string access_zone_id = 2;
  string access_zone_code = 51;
  DocumentIdentity document = 10;
  repeated LogicalBlock blocks = 20;
  TokenAwareChunkingOptions chunking_options = 30;
  VectorIndexingOptions indexing_options = 40;
  map<string, string> metadata = 50;
}

message IndexingSummary {
  uint32 blocks_received = 1;
  uint32 blocks_accepted = 2;
  uint32 blocks_rejected = 3;
  uint32 chunks_created = 10;
  uint32 parent_chunks_created = 11;
  uint32 child_chunks_created = 12;
  uint32 atomic_chunks_created = 13;
  uint32 dense_vectors_created = 20;
  uint32 sparse_vectors_created = 21;
  uint32 qdrant_points_scheduled = 30;
  bool already_indexed = 40;
}

message IndexLogicalDocumentResponse {
  DocumentRef document = 1;
  OperationStatus operation = 2;
  IndexingSummary summary = 10;
}



message StartLogicalDocumentIngestionRequest { string access_zone_id=1; string document_id=2; uint32 document_version=3; string source_uri=4; string file_name=5; string content_hash=6; string idempotency_key=7; uint64 total_bytes_estimate=8; uint32 total_blocks_estimate=9; uint32 total_pages_estimate=10; map<string,string> metadata=11; uint32 ttl_days=20; string access_zone_code=21; }
message StartLogicalDocumentIngestionResponse { string ingestion_session_id=1; string status=2; string expires_at=3; repeated DiagnosticWarningV005 warnings=20; }
message AppendLogicalDocumentBlocksRequest { string ingestion_session_id=1; repeated LogicalBlock blocks=2; uint32 batch_index=3; bool is_last_batch=4; string batch_content_hash=5; }
message AppendLogicalDocumentBlocksResponse { string ingestion_session_id=1; string status=2; uint32 accepted_blocks=3; uint32 accepted_batch_index=4; repeated DiagnosticWarningV005 warnings=20; }
message FinalizeLogicalDocumentIngestionRequest { string ingestion_session_id=1; string final_content_hash=2; }
message AbortLogicalDocumentIngestionRequest { string ingestion_session_id=1; string reason=2; }
message AbortLogicalDocumentIngestionResponse { string ingestion_session_id=1; string status=2; }
message GetLogicalDocumentIngestionStatusRequest { string ingestion_session_id=1; }
message GetLogicalDocumentIngestionStatusResponse { string ingestion_session_id=1; string status=2; uint32 received_batches=3; uint64 received_blocks=4; uint64 received_bytes=5; string expires_at=6; string error_code=7; string error_message=8; }
message GetDocumentVectorStatusRequest {
  RequestContext context = 1;
  DocumentRef document = 2;
  bool include_qdrant = 10;
}

message DocumentVectorStatus {
  OperationState state = 1;
  float progress_percent = 2;
  bool searchable = 3;
  string message = 4;
  bool ready_to_activate = 10;
  GetVectorSyncStatusResponse sync = 20;
}

message GetDocumentVectorStatusResponse {
  DocumentRef document = 1;
  DocumentVectorStatus status = 2;
}

message DeleteDocumentVectorsFacadeRequest {
  RequestContext context = 1;
  DocumentRef document = 2;
  string reason = 10;
}

message DeleteDocumentVectorsFacadeResponse {
  DocumentRef document = 1;
  OperationStatus operation = 2;
}

enum RetrievalProfile {
  RETRIEVAL_PROFILE_UNSPECIFIED = 0;
  RETRIEVAL_PROFILE_BALANCED = 1;
  RETRIEVAL_PROFILE_LEGAL = 2;
  RETRIEVAL_PROFILE_TECHNICAL = 3;
  RETRIEVAL_PROFILE_SEMANTIC = 4;
  RETRIEVAL_PROFILE_LEXICAL_STRICT = 5;
}

enum ResponseDetail {
  RESPONSE_DETAIL_UNSPECIFIED = 0;
  RESPONSE_DETAIL_COMPACT = 1;
  RESPONSE_DETAIL_STANDARD = 2;
  RESPONSE_DETAIL_DEBUG = 3;
}

enum EvidenceStatus {
  EVIDENCE_STATUS_UNSPECIFIED = 0;
  EVIDENCE_STATUS_FOUND = 1;
  EVIDENCE_STATUS_INSUFFICIENT = 2;
  EVIDENCE_STATUS_DEGRADED = 3;
}

message RetrieveContextRequest {
  RequestContext context = 1;
  string access_zone_id = 2;
  string question = 3;
  repeated string access_zone_ids = 50;
  string access_zone_code = 51;
  repeated string access_zone_codes = 52;
  RetrievalProfile profile = 10;
  uint32 max_contexts = 11;
  repeated SearchFilterV004 filters = 20;
  ResponseDetail response_detail = 30;
  bool enable_graph_expansion = 40;
  uint32 graph_max_hops = 41;
  uint32 graph_max_related_contexts = 42;
}

message Citation {
  string document_id = 1;
  uint64 document_version = 2;
  string source_uri = 3;
  string title = 4;
  uint32 page_start = 10;
  uint32 page_end = 11;
  string section_path = 20;
  string heading = 21;
  string matched_chunk_id = 30;
  string parent_chunk_id = 31;
  string source_block_id = 40;
}

message Scores {
  float dense_score = 1;
  float sparse_score = 2;
  float fusion_score = 3;
  float final_score = 4;
}

message RetrievedContext {
  string matched_text = 1;
  string parent_text = 2;
  Citation citation = 10;
  Scores scores = 11;
  string document_id = 20;
  uint64 document_version = 21;
  string source_block_id = 30;
  string matched_chunk_id = 31;
  string parent_chunk_id = 32;
  string access_zone_id = 33;
  repeated SourceLink source_links = 40;
  map<string, string> metadata = 50;
}

message RetrievalSummary {
  uint32 total_candidates = 1;
  uint32 returned_contexts = 2;
  RetrievalProfile profile = 3;
  EvidenceStatus evidence_status = 10;
  bool degraded = 11;
  repeated string degradation_codes = 12;
  string corpus_snapshot_id = 13;
  string effective_config_sha256 = 14;
  bool dense_branch_executed = 20;
  bool sparse_branch_executed = 21;
  bool fusion_executed = 22;
  uint32 dense_branch_candidate_count = 23;
  uint32 sparse_branch_candidate_count = 24;
  uint32 fusion_candidate_count = 25;
}

message RetrieveContextResponse {
  repeated RetrievedContext contexts = 1;
  RetrievalSummary summary = 2;
  repeated DiagnosticWarningV005 warnings = 3;
}

message ExplainRetrieveRequest {
  RequestContext context = 1;
  string access_zone_id = 2;
  string question = 3;
  RetrievalProfile profile = 10;
  uint32 max_contexts = 11;
  repeated SearchFilterV004 filters = 20;
}

message ExplainRetrieveResponse {
  ExplainSearchResponse explain = 1;
}

message DebugDocumentRequest {
  RequestContext context = 1;
  DocumentRef document = 2;
  bool include_chunks = 10;
  bool include_vectors = 11;
  bool include_outbox = 12;
  bool include_qdrant = 13;
}

message DebugDocumentResponse {
  DebugDocumentStateResponse debug = 1;
}

message RetryOutboxFacadeRequest {
  RequestContext context = 1;
  DocumentRef document = 2;
  string operation = 10;
  string status = 11;
}

message RetryOutboxFacadeResponse {
  RetryVectorOutboxResponse result = 1;
}

message RetryDocumentDeletionRequest {
  RequestContext context = 1;
  string access_zone_id = 2;
  string access_zone_code = 3;
  string document_id = 4;
  uint64 document_version = 5;
  bool reset_attempts = 10;
  string reason = 11;
}

message RetryDocumentDeletionResponse {
  bool accepted = 1;
  string previous_lifecycle_status = 2;
  string new_lifecycle_status = 3;
  uint32 delete_attempts = 4;
  string next_delete_attempt_at = 5;
}

message GetRuntimeHealthRequest {
  RequestContext context = 1;
}

