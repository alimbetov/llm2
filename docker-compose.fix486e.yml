services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: astravector
      POSTGRES_USER: astravector
      POSTGRES_PASSWORD: astravector
    ports: ["${FIX486E_POSTGRES_PORT:-58432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astravector -d astravector"]
      interval: 2s
      timeout: 2s
      retries: 60
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports: ["${FIX486E_QDRANT_HTTP_PORT:-6633}:6333", "${FIX486E_QDRANT_GRPC_PORT:-6634}:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 2s
      retries: 60
volumes:
  postgres_data:
  qdrant_data:
