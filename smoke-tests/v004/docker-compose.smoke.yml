services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: astravector-v004-smoke-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astravector_smoke}
      POSTGRES_USER: ${POSTGRES_USER:-astravector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astravector} -d ${POSTGRES_DB:-astravector_smoke}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [astravector-smoke]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: astravector-v004-smoke-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-56333}:6333"
      - "${QDRANT_GRPC_PORT:-56334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [astravector-smoke]

networks:
  astravector-smoke:
    name: astravector-v004-smoke
    driver: bridge
