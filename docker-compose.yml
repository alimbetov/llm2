services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: astravector
      POSTGRES_USER: astravector
      POSTGRES_PASSWORD: astravector
    ports:
      - "55432:5432"
    volumes:
      - astravector_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astravector -d astravector"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - astravector_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  astravector_pg:
  astravector_qdrant:
