apiVersion: apps/v1
kind: Deployment
metadata:
  name: astravector-runtime
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: astravector-runtime }
  template:
    metadata:
      labels: { app: astravector-runtime }
    spec:
      imagePullSecrets:
        - name: astravector-registry-pull
      terminationGracePeriodSeconds: 45
      containers:
        - name: astravector
          image: registry.astrabase.asia/astravector:0.4.1-image-contract
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: astravector-config }
            - secretRef: { name: astravector-secret }
          volumeMounts:
            - { name: model, mountPath: /models/bge-m3, readOnly: false }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            grpc:
              port: 50051
              service: astravector.embedding.v1.AstraVectorRuntime
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            grpc:
              port: 50051
              service: astravector.embedding.v1.AstraVectorRuntime
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 8Gi }
      volumes:
        - name: model
          persistentVolumeClaim: { claimName: astravector-model-pvc }
