apiVersion: batch/v1
kind: CronJob
metadata:
  name: astravector-lifecycle
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
            - name: astravector-registry-pull
          restartPolicy: OnFailure
          containers:
            - name: lifecycle
              image: registry.astrabase.asia/astravector:0.4.1-image-contract
              command: ["/usr/local/bin/astravector-lifecycle"]
              envFrom:
                - configMapRef: { name: astravector-config }
                - secretRef: { name: astravector-secret }
              env:
                - name: ASTRAVECTOR_QDRANT_ENABLED
                  value: "true"
