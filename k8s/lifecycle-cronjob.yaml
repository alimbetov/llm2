apiVersion: batch/v1
kind: CronJob
metadata:
  name: astravector-lifecycle
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: lifecycle
              image: astravector-runtime:0.4.1-fix465-p2-production-hardening
              command: ["/usr/local/bin/astravector-lifecycle"]
              envFrom:
                - configMapRef: { name: astravector-config }
                - secretRef: { name: astravector-secret }
              env:
                - name: ASTRAVECTOR_QDRANT_ENABLED
                  value: "true"
