apiVersion: batch/v1
kind: Job
metadata:
  name: astravector-migrations
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: astravector-runtime:0.4.1-fix465-p2-production-hardening
          command: ["/usr/local/bin/astravector-runtime", "migrate"]
          envFrom:
            - secretRef: { name: astravector-secret }
