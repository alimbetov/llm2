apiVersion: batch/v1
kind: Job
metadata:
  name: astravector-migrations
spec:
  template:
    spec:
      imagePullSecrets:
        - name: astravector-registry-pull
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: registry.astrabase.asia/astravector:0.4.1-image-contract
          command: ["/usr/local/bin/astravector-runtime", "migrate"]
          envFrom:
            - secretRef: { name: astravector-secret }
