apiVersion: v1
kind: ConfigMap
metadata:
  name: astravector-config
data:
  ASTRAVECTOR_CONFIG: /app/config/application.yaml
  ASTRAVECTOR_ENV: production
  ASTRAVECTOR_MODEL_PATH: /models/bge-m3/model.int8.onnx
  ASTRAVECTOR_TOKENIZER_PATH: /models/bge-m3/tokenizer.json
  ASTRAVECTOR_AUTH_ENABLED: "true"
  ASTRAVECTOR_TRUST_FORWARDED_IDENTITY_HEADERS: "true"
  ASTRAVECTOR_GATEWAY_TRUST_HEADER: "x-astravector-gateway-trust"
  ASTRAVECTOR_QDRANT_ENABLED: "true"
  ASTRAVECTOR_QDRANT_URL: "http://qdrant:6333"
  ASTRAVECTOR_QDRANT_COLLECTION: "astravector_v004"
  ASTRAVECTOR_INDEX_TTL_CLEANUP_ENABLED: "true"
