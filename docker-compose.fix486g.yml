services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: astravector
      POSTGRES_USER: astravector
      POSTGRES_PASSWORD: astravector
    ports: ["${FIX486G_POSTGRES_PORT:-59432}:5432"]
    volumes: ["fix486g_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astravector -d astravector"]
      interval: 2s
      timeout: 2s
      retries: 60
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports: ["${FIX486G_QDRANT_HTTP_PORT:-6733}:6333", "${FIX486G_QDRANT_GRPC_PORT:-6734}:6334"]
    volumes: ["fix486g_qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 2s
      retries: 60
volumes:
  fix486g_postgres_data:
  fix486g_qdrant_data:
