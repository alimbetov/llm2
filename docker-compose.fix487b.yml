services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: astravector
      POSTGRES_USER: astravector
      POSTGRES_PASSWORD: astravector
    ports: ["${FIX487B_POSTGRES_PORT:-60432}:5432"]
    volumes: ["fix487b_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astravector -d astravector"]
      interval: 2s
      timeout: 2s
      retries: 60
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports: ["${FIX487B_QDRANT_HTTP_PORT:-6833}:6333", "${FIX487B_QDRANT_GRPC_PORT:-6834}:6334"]
    volumes: ["fix487b_qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 2s
      retries: 60
volumes:
  fix487b_postgres_data:
  fix487b_qdrant_data:
