name: fix484-bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: >-
      github.head_ref == 'agent/fix484-tiered-query-processing-2048' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy

      - name: Apply guarded fix484 migration
        run: python3 scripts/fix484_patch_existing.py

      - name: Format
        run: cargo fmt --all

      - name: Compile all targets and features
        run: cargo check --all-targets --all-features

      - name: Run query-processing unit tests
        run: cargo test query_processing --lib -- --nocapture

      - name: Run query-processing contract tests
        run: cargo test --test query_processing_contracts -- --nocapture

      - name: Commit validated generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/application.yaml \
            config/application-prod.yaml \
            src/config/mod.rs \
            src/grpc/mod.rs \
            src/query_processing \
            tests/query_processing_contracts.rs
          git commit -m "fix484: apply validated tiered runtime wiring [fix484 generated]"
          git push origin "HEAD:${{ github.head_ref }}"
