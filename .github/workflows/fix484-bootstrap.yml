name: fix484-bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: >-
      github.head_ref == 'agent/fix484-tiered-query-processing-2048' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Apply guarded fix484 migration
        run: python3 scripts/fix484_patch_existing.py

      - name: Format
        run: cargo fmt --all

      - name: Compile and capture diagnostics
        id: compile
        shell: bash
        run: |
          mkdir -p docs/evidence/fix484-bootstrap
          set +e
          cargo check --all-targets --all-features 2>&1 | tee docs/evidence/fix484-bootstrap/cargo-check.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run query-processing unit tests
        if: steps.compile.outputs.exit_code == '0'
        run: cargo test query_processing --lib -- --nocapture

      - name: Run query-processing contract tests
        if: steps.compile.outputs.exit_code == '0'
        run: cargo test --test query_processing_contracts -- --nocapture

      - name: Commit generated changes and compiler evidence
        if: always()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              config/application.yaml \
              config/application-prod.yaml \
              src/config/mod.rs \
              src/grpc/mod.rs \
              src/query_processing
            git add -f docs/evidence/fix484-bootstrap/cargo-check.log
            git commit -m "fix484: apply tiered runtime wiring and compiler evidence [fix484 generated]"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Fail when compile gate is red
        if: always() && steps.compile.outputs.exit_code != '0'
        run: |
          echo "cargo check failed; see docs/evidence/fix484-bootstrap/cargo-check.log"
          exit 1
