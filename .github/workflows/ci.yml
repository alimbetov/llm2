name: ci
on: [push, pull_request]
env:
  ASTRAVECTOR_IMAGE_TAG: 0.4.1-image-contract
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: astravector
          POSTGRES_PASSWORD: astravector
          POSTGRES_DB: astravector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astravector -d astravector"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://astravector:astravector@127.0.0.1:5432/astravector
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Provision pinned BGE-M3 tokenizer
        env:
          TOKENIZER_URL: https://huggingface.co/BAAI/bge-m3/resolve/5617a9f61b028005a4858fdac845db406aefb181/tokenizer.json
          TOKENIZER_SHA256: 21106b6d7dab2952c1d496fb21d5dc9db75c28ed361a05f5020bbba27810dd08
        run: |
          tokenizer_dir="$RUNNER_TEMP/models/bge-m3"
          tokenizer_path="$tokenizer_dir/tokenizer.json"
          mkdir -p "$tokenizer_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            "$TOKENIZER_URL" \
            --output "$tokenizer_path"
          printf '%s  %s\n' "$TOKENIZER_SHA256" "$tokenizer_path" | sha256sum --check --strict
          printf 'ASTRAVECTOR_TOKENIZER_PATH=%s\n' "$tokenizer_path" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked query_processing --lib -- --nocapture
      - run: cargo test --locked --test query_processing_contracts -- --nocapture
      - run: cargo test --locked --test query_normalization_offsets -- --nocapture
      - run: cargo test --locked --test multi_intent_evidence -- --nocapture
      - run: cargo test --locked --test retrieval_failure_semantics -- --nocapture
      - run: cargo test --locked --test graph_intent_provenance -- --nocapture
      - run: cargo test --locked --test explain_search_parity -- --nocapture
      - run: cargo test --locked --test mixed_tier_fairness -- --nocapture
      - run: cargo test --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres --locked
      - run: cargo sqlx prepare --check -- --all-targets --all-features
      - run: cargo test --locked --features integration-tests --test smoke_load_retrieve_context_testcontainers -- --nocapture
  smoke-load-testcontainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - run: cargo test --locked --features integration-tests --test smoke_load_retrieve_context_testcontainers -- --nocapture
